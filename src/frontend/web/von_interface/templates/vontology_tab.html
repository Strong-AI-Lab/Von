<!-- Vontology Tab Content -->
<!-- JVNAUTOSCI-322: Dynamic Concept Tabs on Vontology Selection -->
<div class="vontology-container">
  <!-- Title & search moved to global header (JVNAUTOSCI-550) -->
  <div class="von-resizable-panel-header vontology-tree-header">
    <span class="von-resizable-panel-label">Tree viewport</span>
    <div id="vontologyTreeResizeControls" class="von-resize-controls" role="group"
      aria-label="Vontology tree viewport size" aria-controls="vontologyTreeContainer">
      <button type="button" class="von-resize-button" data-resize-action="decrease"
        aria-label="Show fewer Vontology tree rows" title="Show fewer tree rows">−</button>
      <button type="button" class="von-resize-button" data-resize-action="increase"
        aria-label="Show more Vontology tree rows" title="Show more tree rows">+</button>
      <button type="button" class="von-resize-button von-resize-reset" data-resize-action="reset"
        aria-label="Reset Vontology tree height" title="Reset Vontology tree height">Reset</button>
      <button type="button" class="von-resize-button" data-resize-action="decrease-width"
        aria-label="Make Vontology tree narrower" title="Make tree narrower">←</button>
      <button type="button" class="von-resize-button" data-resize-action="increase-width"
        aria-label="Make Vontology tree wider" title="Make tree wider">→</button>
      <button type="button" class="von-resize-button von-resize-reset" data-resize-action="reset-width"
        aria-label="Fit Vontology tree to available width" title="Fit tree to available width">Fit</button>
    </div>
  </div>
  <div id="vontologyTreeContainer" class="von-resizable-viewport" data-resize-axis="both">
    <!-- Tree will be rendered here by JavaScript -->
    <p>Loading Vontology tree...</p>
  </div>
  <div id="vontologySelectedNode">
    Selected: <span id="selectedNodePath">None</span>
  </div>
  <!-- Node content and editing controls removed from Vontology tab.
             Description is now shown and editable on the Type concept tab. -->

  <!-- Move the button here, below the node content box -->
  <div class="vontology-controls">
    <button id="loadVontologyTreeButton" class="vontology-refresh-button hidden">Load Vontology Tree</button>
    <span id="vontologyPreloadOffBadge" class="hidden" aria-live="polite">Preload is off</span>
    <small id="vontologyPreloadOffHelp" class="hidden">Enable in Settings → Vontology UI &amp; Performance.</small>
    <button id="showSubtreeDetailsButton" disabled>Show Subtree Details</button>
    <button id="refreshTreeButton" class="vontology-refresh-button">🔄 Refresh Tree</button>
    <label>
      <input type="checkbox" id="collapseLinearCheckbox" /> Collapse linear chains
    </label>
    <label>
      <input type="checkbox" id="filterRedundantCheckbox" checked /> Filter redundant nodes
    </label>
    <label>
      <input type="checkbox" id="showOnlyKeyConceptsCheckbox" /> Show only key concepts ⭐
    </label>
  </div>

  <!-- Removed old Import/Export informational message -->

  <!-- Add Area for Subtree Details -->
  <div id="subtreeDetailsContainer" class="hidden">
    <h3>Subtree Node Details:</h3>
    <pre id="subtreeDetailsDisplay">Click "Show Subtree Details" after selecting a node.</pre>
    <p id="subtreeDetailsStatus"></p>
  </div>

  <div id="vontologyCreateConcept" class="hidden"> <!-- Hidden until a type is selected -->
    <h3>Create New Concept</h3>
    <div class="vontology-form-group">
      <label for="newConceptName">New Concept Name:</label>
      <input type="text" id="newConceptName" name="newConceptName">
    </div>
    <div class="vontology-create-actions">
      <button id="createTypeButton" class="btn btn-primary btn-lg">Create new type</button>
      <button id="createInstanceButton" class="btn btn-secondary btn-lg">Create new instance</button>
    </div>
    <p id="createConceptStatus"></p>
  </div>
</div>
