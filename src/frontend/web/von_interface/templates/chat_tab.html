<!-- Chat Tab Content -->
<div id="chatTab" class="tab-content">
  <div class="chat-container">
    <!-- Header with Von intro -->
    <h2 class="chat-title">Talk to Von Neumarkt</h2>

    <!-- Scrollable field for text input and responses -->
    <div id="scrollableField" class="chat-scrollable-field">
      <!-- Content will be dynamically added here via JavaScript -->
    </div>

    <!-- Loading indicator -->
    <div id="loadingIndicator" class="chat-loading-indicator">Thinking...</div>

    <!-- Textarea for user prompt -->
    <textarea id="promptInput" rows="6" class="chat-prompt-input" placeholder="Talk with Von here..."></textarea>

    <!-- Buttons for sending prompt and resetting context -->
    <div class="button-row">
      <button id="sendButton">Send Prompt</button>
      <button id="resetButton">Reset Context</button>
      <label class="annotation-toggle" title="Enable concept annotations in chat responses">
        <input type="checkbox" id="annotationToggle">
        <span class="eye-icon">
          <svg aria-hidden="true" class="icon icon-annotate" viewBox="0 0 24 24" width="16" height="16"
            stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </span>
        <span class="toggle-label">Annotations</span>
      </label>
    </div>
  </div>

  <!-- Hidden LLM debug popup -->
  <div id="chatLlmDebugPopup" class="llm-popup hidden" aria-hidden="true">
    <div class="llm-popup-header">
      <span>LLM Debug Information</span>
      <button id="closeChatLlmDebug" class="btn-mini" title="Close">✕</button>
    </div>
    <div class="llm-popup-body">
      <div class="llm-popup-section">
        <h4>Model & Context</h4>
        <div id="chatLlmDebugMeta" class="llm-meta"></div>
      </div>
      <div class="llm-popup-section">
        <h4>Messages Sent to LLM</h4>
        <pre id="chatLlmDebugMessages" class="llm-pre"></pre>
      </div>
      <div class="llm-popup-section">
        <h4>LLM Response</h4>
        <pre id="chatLlmDebugResponse" class="llm-pre"></pre>
      </div>
      <div class="llm-popup-section" id="chatLlmDebugToolsSection">
        <h4>Tool Invocations</h4>
        <pre id="chatLlmDebugTools" class="llm-pre"></pre>
      </div>
    </div>
    <div class="llm-popup-footer">
      <button id="copyChatLlmDebugJson" class="btn-mini" title="Copy debug info as JSON">Copy JSON</button>
    </div>
  </div>
</div>
