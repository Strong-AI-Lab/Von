[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.1.1",
    "mongomock>=4.3.0",
    "pyright==1.1.408",
    "blinker>=1.9.0",
    "pymongo>=4.15.1",
    "annotated-types>=0.7.0",
    "anyio>=4.10.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pyright]
include = ["src"]
executionEnvironments = [
    # Use project root so that top-level package name 'src' resolves.
    { root = ".", extraPaths = ["src"] }
]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
extraPaths = ["src"]
stubPath = "typings"
venvPath = "."
venv = ".venv"

[tool.pdm]
distribution = false

[tool.pdm.dependencies]
test = [
    "pytest>=8.3.3",
]
dev = [
    "pytest>=8.3.3",
]

[tool.pdm.python]
use_venv = true

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated.*:DeprecationWarning:mongomock\\..*",
    "ignore:OpenAI model not configured:UserWarning:src\\.backend\\.languagemodels\\.llm_interface",
    "ignore:pkg_resources is deprecated as an API\\..*:UserWarning:llama_index\\.download\\.module",
    "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('node'\\)`\\..*:DeprecationWarning:pkg_resources",
    "ignore:Deprecated call to `pkg_resources\\.declare_namespace\\('zope'\\)`\\..*:DeprecationWarning:pkg_resources",
]
