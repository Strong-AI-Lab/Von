version = 1
name = "Von Env"

[setup]
script = ""

[setup.win32]
script = '''


if (-not $env:CODEX_HOME) {
    $env:CODEX_HOME = Join-Path $env:USERPROFILE '.codex'
}

$worktreePath = (Get-Location).Path

$gitPointer = $null
$mainRepoRoot = $null

if (Test-Path (Join-Path $worktreePath '.git')) {
    $gitRaw = Get-Content (Join-Path $worktreePath '.git') -ErrorAction SilentlyContinue
    if ($gitRaw -match '^gitdir:\s*(.+)$') {
        $gitPointer = $Matches[1].Trim()
        $gitCommonDir = Split-Path (Split-Path $gitPointer -Parent) -Parent
        $mainRepoRoot = Split-Path $gitCommonDir -Parent
    }
}

if ($worktreePath) {
    git config --global --add safe.directory ($worktreePath -replace '\\','/')
}
if ($mainRepoRoot) {
    git config --global --add safe.directory ($mainRepoRoot -replace '\\','/')
}

Set-Location "$env:CODEX_WORKTREE_PATH"
powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\powershell\setup_codex_automation_environment.ps1
'''
